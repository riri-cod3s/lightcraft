name: QuickCull (Mac app)

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/quickcull/**"
      - ".github/workflows/quickcull-mac.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Build (Apple Silicon + Intel)
        working-directory: tools/quickcull
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
      - name: Make QuickCull.app
        working-directory: tools/quickcull
        run: |
          APP=QuickCull.app
          mkdir -p "$APP/Contents/MacOS"
          lipo -create -output "$APP/Contents/MacOS/quickcull" \
            target/aarch64-apple-darwin/release/quickcull \
            target/x86_64-apple-darwin/release/quickcull
          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>QuickCull</string>
            <key>CFBundleDisplayName</key><string>QuickCull</string>
            <key>CFBundleIdentifier</key><string>dev.quickcull.app</string>
            <key>CFBundleExecutable</key><string>quickcull</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>0.1.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST
          codesign --force --deep -s - "$APP"
          ditto -c -k --keepParent "$APP" QuickCull-mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: QuickCull-mac
          path: tools/quickcull/QuickCull-mac.zip
